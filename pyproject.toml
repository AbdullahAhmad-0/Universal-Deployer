[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uhdeploy"
version = "0.1.0"
description = "Universal Local-to-VPS automated deployment CLI (SSH/SFTP, FTP, Docker, Local Build Pipelines)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Abdullah Ahmad" }
]
keywords = ["deployment", "vps", "docker", "ssh", "sftp", "ftp", "devops", "automation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Installation/Setup",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pyyaml>=6.0",
    "paramiko>=2.11.0",
    "colorama>=0.4.6",
]

[project.urls]
Homepage = "https://github.com/AbdullahAhmad-0/Universal-Deployer"
Repository = "https://github.com/AbdullahAhmad-0/Universal-Deployer"
Issues = "https://github.com/AbdullahAhmad-0/Universal-Deployer/issues"

[project.scripts]
uhdeploy = "uhdeploy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["uhdeploy*"]

