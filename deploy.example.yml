# deploy.example.yml
# =============================================================================
# 🚀 Universal Deployer Configuration Example (deploy.yml)
# =============================================================================
# This file defines how your application services are built, uploaded, and run
# on your VPS server via SSH or FTP.
#
# Environment variables like ${VPS_IP} or ${SSH_KEY_PATH} are automatically
# loaded from .env or .env.deploy in your project root!
# =============================================================================

# (Optional) Global connection settings inherited by all services
server:
  type: ssh                     # Protocol: "ssh" (SFTP + Shell) or "ftp" (File transfer only)
  host: ${VPS_IP}               # VPS IP address or domain (or set hardcoded)
  user: ${VPS_USER:-root}       # SSH/FTP Username (defaults to root)
  port: 22                      # Port: 22 for SSH, 21 for FTP
  key_path: ${SSH_KEY_PATH}     # Path to private key file (e.g., ~/.ssh/id_rsa or C:/keys/vps.pem)
  passphrase: ${SSH_PASSPHRASE} # (Optional) Passphrase if your private key is encrypted
  password: ${VPS_PASSWORD}     # (Optional) SSH or FTP password if not using key
  remote_dir: /opt/my-project   # Remote base directory on the VPS

  # High-performance transfer settings:
  threads: 8                    # (Optional) Concurrent upload worker threads (default: 8)
  retries: 5                    # (Optional) Reconnect and retry attempts on dropped sockets (default: 5)
  # archive: true               # (Optional) Ultra-fast 1-shot compressed archive sync (SSH only)
  # overwrite: false            # (Optional) Set false to skip files that already exist on server (default: true)

# (Optional) Specify custom env file to load (default: .env or .env.deploy)
env_file: .env

# =============================================================================
# SERVICES DEFINITION
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # 🌐 Service 1: Frontend (Static / SPA / Next.js / Vue / React) - NO DOCKER
  # ---------------------------------------------------------------------------
  frontend:
    description: "React/Next.js frontend build & static sync"
    docker: false              # Disable docker for this service

    # Local working directory (relative to project root)
    work_dir: ./frontend

    # Build steps (Dockerfile-style string syntax or list of commands)
    build:
      - RUN npm install
      - RUN npm run build
      - COPY package.json dist/package.json
      # You can run any local build or packaging commands here:
      # - RUN echo "Frontend build finished"

    # Upload files or directories to the VPS
    # Format: "local_path -> remote_path" or specify as list
    upload:
      - dist/ -> ${remote_dir}/frontend/dist
      - public/ -> ${remote_dir}/frontend/public

    # Upload & Transfer Options:
    # overwrite: false         # (Optional) Set false to skip files that already exist on VPS (default: true)
    # clean_remote: true       # Set true to wipe/empty destination directory on VPS before uploading
    # archive: false           # Set true for ultra-fast single-shot archive transfer (SSH only)
    # threads: 8               # Number of parallel upload threads (default: 8)
    # retries: 5               # Retry attempts on network drop (default: 5)

    # Commands to execute on the remote VPS after upload (SSH ONLY)
    # NOTE: If server type is FTP, remote shell execution is NOT supported.
    run_in_vps:
      - RUN systemctl reload nginx
      - RUN echo "✅ Frontend updated and Nginx reloaded!"

  # ---------------------------------------------------------------------------
  # 🐳 Service 2: Backend (FastAPI / Node / Python) - WITH DOCKER
  # ---------------------------------------------------------------------------
  backend:
    description: "Backend API running in Docker Compose"
    work_dir: ./backend

    # Docker configuration
    docker:
      enabled: true
      # Compose file path (relative to project root, defaults to docker-compose.yml)
      compose_file: docker-compose.yml
      # Compose service name (must match service key defined in docker-compose.yml)
      service_name: backend
      # (Optional) Environment files:
      # Any env_file referenced in docker-compose.yml (e.g. .env.production)
      # is automatically detected and synced to the VPS!
      # Or you can explicitly list them here:
      # env_file: .env.production
      #
      # Build mode:
      # - "local": Builds docker image locally, packages as tar, uploads to VPS,
      #            and loads it on VPS (saves VPS CPU and memory).
      # - "remote": Uploads context and builds directly on the VPS.
      build_mode: local
      image: my-backend:latest
      context: ./backend
      dockerfile: ./backend/Dockerfile

    # Commands to run on VPS BEFORE docker starts
    before_deploy:
      - RUN mkdir -p ${remote_dir}/backend/logs
      - RUN mkdir -p ${remote_dir}/backend/data
      # (Optional) Manual file copy if not auto-synced:
      # - COPY ./backend/.env.production -> ${remote_dir}/backend/.env

    # Commands to run on VPS AFTER docker starts
    # NOTE: The deployer ALREADY starts your container automatically via
    # `docker compose up -d <service_name>`.
    # Use run_in_vps for migrations, status checks, or viewing logs!
    run_in_vps:
      - RUN docker compose ps
      - RUN docker compose logs --tail=25 backend
      - RUN echo "✅ Backend service is up and running!"

  # ---------------------------------------------------------------------------
  # 📁 Service 3: API / Working Directory Upload with Ignore Rules
  # ---------------------------------------------------------------------------
  api:
    description: "Sync current working directory directly to VPS with ignore rules"
    docker: false
    work_dir: ./backend

    # Upload entire working directory (.) to remote VPS destination:
    upload:
      - . -> ${remote_dir}/backend

    # Files and folders to ignore when uploading:
    # (You can also put these into a .deployignore file!)
    ignore:
      - node_modules
      - .venv
      - venv
      - __pycache__
      - .git
      - .env.local
      - "*.log"
      - "*.pyc"

    # Upload behavior settings:
    # overwrite: false         # (Optional) Set false to skip files that already exist on server (default: true)
    # clean_remote: true       # Set true if you want to wipe destination folder before upload
    # archive: false           # (Optional) Enable fast archive sync for directories with 1000+ files
    # threads: 8               # Parallel threads (default: 8)
    # retries: 5               # Retry attempts on connection drops (default: 5)

    run_in_vps:
      - RUN pm2 restart api || pm2 start index.js --name api

  # ---------------------------------------------------------------------------
  # 📡 Service 4: Legacy or Shared Hosting via FTP (File Transfer Only)
  # ---------------------------------------------------------------------------
  ftp_site:
    description: "Static website deployment over plain FTP"
    docker: false
    work_dir: ./frontend
    server:
      type: ftp                # Use FTP protocol
      host: ${FTP_HOST}
      user: ${FTP_USER}
      password: ${FTP_PASS}
      port: 21
      remote_dir: /public_html
      threads: 4               # FTP parallel connections
      retries: 5               # FTP reconnect attempts
      # overwrite: false       # (Optional) Set false to skip files that already exist (default: true)
    upload:
      - dist/ -> /public_html
    # (Optional) Ignore patterns:
    ignore:
      - node_modules
      - .venv
      - __pycache__
      - .git
      - "*.log"
